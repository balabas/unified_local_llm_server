[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-local-llm-server"
version = "0.1.0"
description = "Unified async interface for local OpenAI-compatible LLM providers."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = [
  "ipykernel",
  "nbformat",
  "notebook",
  "openai",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unified_local_llm_server*"]
